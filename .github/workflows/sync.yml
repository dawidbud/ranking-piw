name: Zapis ocen do Excela

on:
  schedule:
    - cron: "*/30 * * * *"   # co pół godziny (szybsze samoleczenie bazy)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency: sync-excel

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl requests
      - run: python scripts/sync_excel.py
      - name: Commit zmian (Excel + kopia bazy + adres bazy)
        run: |
          git config user.name "liga-piw-bot"
          git config user.email "actions@users.noreply.github.com"
          # WAŻNE: commitujemy też store-backup.json i store-config.json,
          # inaczej samoleczenie i świeża kopia zapasowa nigdy nie trafią do repo.
          git add Piwa.xlsx store-backup.json store-config.json
          git diff --staged --quiet || (git commit -m "🤖 Zapis ocen z www do Piwa.xlsx" && git push)
