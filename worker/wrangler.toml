name = "liga-piw"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

# Po utworzeniu bazy komendą `wrangler d1 create liga-piw` wklej tutaj database_id,
# który wypisze terminal (to jedyne miejsce, które musisz uzupełnić ręcznie).
[[d1_databases]]
binding = "DB"
database_name = "liga-piw"
database_id = "WKLEJ_DATABASE_ID_TUTAJ"
